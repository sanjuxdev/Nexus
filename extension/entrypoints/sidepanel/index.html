<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Side Panel</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #0f172a;
      --card-bg: #f8fafc;
      --card-border: #e2e8f0;
      --muted: #64748b;
      --primary: #0f172a;
      --primary-fg: #ffffff;
      --accent: #2563eb;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --radius: 6px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16;
        --fg: #f1f5f9;
        --card-bg: #111827;
        --card-border: #1e293b;
        --muted: #94a3b8;
        --primary: #f8fafc;
        --primary-fg: #090d16;
        --accent: #3b82f6;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--fg);
      font-size: 13px;
      line-height: 1.5;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
